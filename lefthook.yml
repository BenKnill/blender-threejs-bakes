# Local git hooks — fast, parallel, no CI dependency.
# Install: `just hooks` (or `npm install`, which runs `lefthook install` via prepare).
#
# Each command only sees the *staged* files that match its glob, so commits stay quick.
# Formatters auto-fix and re-stage; linters just report and block the commit on error.
# Python uses `ruff` if on PATH, else `uvx ruff` (uv is available; ruff need not be global).
#
# Globs are explicit for each source surface because lefthook's `**/` requires a
# subdirectory and would silently skip the flat editor, demo, and scripts roots.
# Keep each source root explicit so the staged-file hooks cover the same
# JavaScript and Python ownership surfaces as the full local lint gate.

commit-msg:
  commands:
    shape:
      run: ./scripts/check_commit_msg.sh {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "{editor/*.{js,css,html},physics/labs/*/demo/*.{js,css,html,json}}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "{editor/*.js,physics/labs/*/demo/*.js,scripts/*.mjs}"
      run: npx eslint {staged_files}
    ruff-format:
      glob: "{scripts/*.py,scripts/btlib/*.py}"
      run: sh -c 'command -v ruff >/dev/null 2>&1 && ruff format "$@" || uvx ruff format "$@"' _ {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "{scripts/*.py,scripts/btlib/*.py}"
      run: sh -c 'command -v ruff >/dev/null 2>&1 && ruff check "$@" || uvx ruff check "$@"' _ {staged_files}
    contracts:
      glob: "{layouts/*.json,assets/manifest.json}"
      run: python3 scripts/bt.py validate {staged_files}
